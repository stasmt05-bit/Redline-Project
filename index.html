
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redline Architect | V2.1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --redline-glow: 0 0 15px rgba(239, 68, 68, 0.4);
      --redline-intense: 0 0 25px rgba(239, 68, 68, 0.6);
    }
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #050505;
      color: #f4f4f5;
      overflow-x: hidden;
    }
    .red-glow {
      box-shadow: var(--redline-glow);
    }
    .red-glow-border {
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.1), 0 0 10px rgba(239, 68, 68, 0.1);
    }
    .red-glow-text {
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #000;
    }
    ::-webkit-scrollbar-thumb {
      background: #ef4444;
      border-radius: 2px;
    }
    .terminal-scrollbar::-webkit-scrollbar {
      width: 2px;
    }
  </style>
